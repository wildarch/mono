<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Ten</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --card: #2a2a3e;
            --text: #e6e6f0;
            --muted: #9a9ab0;
            --accent: #7c6cf0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 24px 20px;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 28px 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        }

        .prompt {
            font-size: 1.5rem;
            line-height: 1.4;
            font-weight: 600;
            margin: 0 0 24px 0;
        }

        .scale {
            font-size: 1.05rem;
            line-height: 1.5;
            color: var(--muted);
        }

        .scale .low {
            color: #e06c75;
        }

        .scale .high {
            color: #98c379;
        }

        footer {
            padding: 20px 0;
            display: flex;
            justify-content: center;
        }

        button {
            font-size: 1.1rem;
            font-weight: 600;
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body>
    <main>
        <div class="card">
            <p class="prompt" id="prompt"></p>
            <p class="scale">
                From <span class="low" id="low"></span> (1)
                to <span class="high" id="high"></span> (10)
            </p>
        </div>
    </main>

    <footer>
        <button id="next">New question</button>
    </footer>

    <script>
        const questions = [
            {
                prompt: "Your promotor/boss calls you into their office for an urgent meeting. What is the meeting about, and how does it go?",
                low: "very bad/embarrassing",
                high: "fantastic",
            },
            {
                prompt: "You receive an unsolicited email invitation to submit your work to a journal. What kind of journal is it?",
                low: "garbage predatory journal",
                high: "highly prestigious",
            },
            {
                prompt: "You are a superhero with a special ability. What is your superpower?",
                low: "completely useless",
                high: "limitless power",
            },
            {
                prompt: "You are a super villain trying to take over the world. What is your special power or weapon to try and achieve this?",
                low: "adorably hopeless",
                high: "ruthlessly effective",
            },
            {
                prompt: "You take a bite of some food you have never eaten before, how does it taste?",
                low: "disgusting",
                high: "heavenly delicious",
            },
            {
                prompt: "Sneeze.",
                low: "barely noticeable",
                high: "man-made hurricane",
            },
            {
                prompt: "You forget to take your office key when you go to the toilet, and now you are locked out of your office. How hard is it to get back in?",
                low: "trivial",
                high: "extremely difficult",
            },
            {
                prompt: "You turn on the radio. What kind of music (genre or artist) is playing?",
                low: "I hate it",
                high: "my favourite",
            },
            {
                prompt: "Your friends organize a surprise activity for you. What do they have planned?",
                low: "awful/boring/scary",
                high: "awesome/fun",
            },
            {
                prompt: "You have invented something (e.g. an algorithm). How big of a deal is it?",
                low: "nobody cares",
                high: "revolutionary",
            },
            {
                prompt: "You get back to the office after being gone for about an hour. You tell your co-workers you just went to grab a coffee and take a walk. This is a lie! What were you actually doing?",
                low: "nothing interesting",
                high: "a huge scandal",
            },
            {
                prompt: "The reviews for your paper are in. Reviewer #1 and Reviewer #2 give Weak Accept and Weak Accept, respectively, so the final decision hinges on Reviewer #3. What does Reviewer #3 say?",
                low: "fundamentally flawed",
                high: "the best invention since sliced bread",
            },
            {
                prompt: "You run into an acquaintance on the street, how do you greet them?",
                low: "barely acknowledged",
                high: "incredibly excited",
            },
            {
                prompt: "You use an LLM to (try to) accomplish a task, what is the task?",
                low: "pretty normal",
                high: "really weird",
            },
            {
                prompt: "You are served Dutch food. What is it?",
                low: "disgusting",
                high: "delicious",
            },
            {
                prompt: "What are we doing for the next Database Group activity?",
                low: "super boring",
                high: "super fun",
            },
            {
                prompt: "You are at a conference attending a paper presentation. What is it about, and how is it presented?",
                low: "awful",
                high: "fascinating",
            },
        ];

        const promptEl = document.getElementById("prompt");
        const lowEl = document.getElementById("low");
        const highEl = document.getElementById("high");

        function showQuestion(q) {
            promptEl.textContent = q.prompt;
            lowEl.textContent = q.low;
            highEl.textContent = q.high;
        }

        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        let deck = shuffle(questions);
        let index = 0;

        function nextQuestion() {
            if (index >= deck.length) {
                deck = shuffle(questions);
                index = 0;
            }
            showQuestion(deck[index]);
            index++;
        }

        document.getElementById("next").addEventListener("click", nextQuestion);

        nextQuestion();
    </script>
</body>

</html>
